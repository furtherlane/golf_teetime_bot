name: Book Tee Time

on:
  workflow_dispatch:      # manual trigger only - recurring booking runs via local launchd (more reliable than GH Actions schedule)
    inputs:
      skip_wait:
        description: 'Skip waiting until 9PM ET (for testing the rest of the flow now)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Stop before clicking Book Time (no real reservation made)'
        required: false
        default: false
        type: boolean

jobs:
  book:
    runs-on: ubuntu-latest
    env:
      # The booking site's calendar computes "today" from the browser's clock/timezone.
      # GitHub-hosted runners default to UTC, which can be a day ahead of the course's
      # Eastern time in the evening, causing the calendar to show the wrong "last day".
      TZ: America/New_York
      # Public booking page URL - not sensitive, kept here (not as a secret) so it's
      # easy to change. Francis A. Byrne Golf Course.
      FOREUP_SOFTWARE_URL: "https://foreupsoftware.com/index.php/booking/22528/11078#/teetimes"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y --only-upgrade google-chrome-stable
          google-chrome --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          FOREUP_SOFTWARE_URL="${{ env.FOREUP_SOFTWARE_URL }}"
          FOREUP_USERNAME="${{ secrets.FOREUP_USERNAME }}"
          FOREUP_PASSWORD="${{ secrets.FOREUP_PASSWORD }}"
          TWOCAPTCHA_API_KEY="${{ secrets.TWOCAPTCHA_API_KEY }}"
          EOF

      - name: Run tee time booking script
        env:
          SKIP_WAIT: ${{ inputs.skip_wait }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          python selenium_reserve_tee_time.py

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            error_screenshot.png
            error_page_source.html
          if-no-files-found: ignore
