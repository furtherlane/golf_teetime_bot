name: Book Tee Time

on:
  schedule:
    - cron: '40 0 * * 6'  # ~20 min before Friday 9:00 PM ET; script waits for the exact moment (DST-aware)
  workflow_dispatch:      # allows manual trigger for testing
    inputs:
      skip_wait:
        description: 'Skip waiting until 9PM ET (for testing the rest of the flow now)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Stop before clicking Book Time (no real reservation made)'
        required: false
        default: false
        type: boolean

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y --only-upgrade google-chrome-stable
          google-chrome --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          FOREUP_SOFTWARE_URL="${{ secrets.FOREUP_SOFTWARE_URL }}"
          FOREUP_USERNAME="${{ secrets.FOREUP_USERNAME }}"
          FOREUP_PASSWORD="${{ secrets.FOREUP_PASSWORD }}"
          TWOCAPTCHA_API_KEY="${{ secrets.TWOCAPTCHA_API_KEY }}"
          EOF

      - name: Run tee time booking script
        env:
          SKIP_WAIT: ${{ inputs.skip_wait }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          python selenium_reserve_tee_time.py

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            error_screenshot.png
            error_page_source.html
          if-no-files-found: ignore
